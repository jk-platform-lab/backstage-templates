apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: platform-service
  title: Platform service
  description: Creates an infrastructure repository with a VPC, TechDocs and an infradoctor audit on every pull request
  tags:
    - terraform
    - infradoctor
spec:
  owner: user:JayKearney
  type: service

  parameters:
    - title: About the service
      required:
        - name
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Lower case letters, numbers and dashes only
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          default: Infrastructure for a new platform service
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - User
                - Group

    - title: Network
      required:
        - environment
        - vpcCidr
      properties:
        environment:
          title: Environment
          type: string
          enum:
            - dev
            - staging
            - prod
          default: dev
        vpcCidr:
          title: VPC range (CIDR)
          type: string
          description: Must not overlap the ranges in terraform/known-ranges.txt (10.0-10.3, 10.10, 10.20 and 192.168 are taken)
          pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
          default: 10.4.0.0/16

    - title: Where to create it
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - jk-platform-lab

  steps:
    - id: fetchSkeleton
      name: Copy the skeleton files
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          environment: ${{ parameters.environment }}
          vpcCidr: ${{ parameters.vpcCidr }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Create the GitHub repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
        gitCommitMessage: Initial commit from the Platform service template
        topics:
          - terraform
          - platform-service
          - ${{ parameters.environment }}
        hasWiki: false
        hasProjects: false
        deleteBranchOnMerge: true
        allowMergeCommit: false
        allowRebaseMerge: false
        allowSquashMerge: true
        protectDefaultBranch: true
        protectEnforceAdmins: false
        requiredApprovingReviewCount: 0
        requiredStatusCheckContexts:
          - Network (VPC overlaps)
        requireBranchesToBeUpToDate: true
        requiredConversationResolution: true

    - id: register
      name: Register it in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: First audit run
        url: ${{ steps['publish'].output.remoteUrl }}/actions
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}