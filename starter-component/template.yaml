apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: starter-component
  title: Starter component
  description: Creates a small repository with a README and catalog-info.yaml, and registers it in the catalog
  tags:
    - learning
spec:
  owner: user:JayKearney
  type: service

  parameters:
    - title: About the component
      required:
        - name
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Lower case letters, numbers and dashes only
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          default: A small component created from a Backstage template
        owner:
          title: Owner
          type: string
          description: Who owns this component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - User
                - Group

    - title: Where to create it
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - jk-platform-lab

  steps:
    - id: fetchSkeleton
      name: Copy the skeleton files
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          repoOwner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}

    - id: publish
      name: Create the GitHub repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register it in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}